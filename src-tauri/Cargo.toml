[package]
name = "diagram-source-studio"
version = "0.1.7"
description = "Check diagram renders before commit"
authors = ["Param Factory"]
license = "MIT"
edition = "2021"

[lib]
name = "diagram_source_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "diagram-source-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
base64 = "0.22"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.8", features = [] }
